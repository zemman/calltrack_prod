<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Карточка клиента</title>

  <style>
    :root {
      --bg: #0f1117;
      --card: #171a23;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f4f6fb;
      --muted: #9ca3af;
      --accent: #3c83f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --input-bg: #0f1320;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(60, 131, 246, 0.18), transparent 32%),
                  var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .client-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0 14px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(60, 131, 246, 0.16);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button,
    a.button {
      height: 44px;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button.primary,
    a.primary {
      background: var(--accent);
      color: white;
    }

    button.primary:hover,
    a.primary:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.error {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .raw-url {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <main class="client-card">
    <p class="eyebrow">Infinity Call Center X</p>
    <h1>Карточка клиента</h1>

    <p class="description">
      Номер телефона автоматически берётся из параметра <b>phone</b> в адресной строке.
    </p>

    <form id="clientForm">
      <div class="form-group">
        <label for="phone">Телефон клиента</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          placeholder="Например: 79001234567"
          autocomplete="tel"
        />
      </div>

      <div class="actions">
        <button class="primary" type="submit">
          Найти клиента
        </button>

        <button class="secondary" type="button" id="copyPhone">
          Скопировать номер
        </button>

        <a class="button primary" id="callLink" href="#">
          Позвонить
        </a>
      </div>
    </form>

    <div id="status" class="status">
      Ожидаю номер телефона...
    </div>

    <div id="rawUrl" class="raw-url"></div>
  </main>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function normalizePhone(phone) {
      if (!phone) return "";

      let value = String(phone).trim();

      // Декодируем URL, если Infinity передал номер в encoded-виде
      try {
        value = decodeURIComponent(value);
      } catch (error) {
        // оставляем как есть
      }

      // Убираем пробелы, скобки, дефисы и прочие символы, кроме цифр и +
      value = value.replace(/[^\d+]/g, "");

      // Если номер начинается с 8 и содержит 11 цифр — заменяем на 7
      if (/^8\d{10}$/.test(value)) {
        value = "7" + value.slice(1);
      }

      // Если номер начинается с +7 — убираем плюс
      if (/^\+7\d{10}$/.test(value)) {
        value = value.slice(1);
      }

      return value;
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    document.addEventListener("DOMContentLoaded", function () {
      const phoneInput = document.getElementById("phone");
      const copyButton = document.getElementById("copyPhone");
      const callLink = document.getElementById("callLink");
      const form = document.getElementById("clientForm");
      const rawUrl = document.getElementById("rawUrl");

      const rawPhone = getQueryParam("phone");
      const phone = normalizePhone(rawPhone);

      rawUrl.textContent = "Текущий URL: " + window.location.href;

      if (phone) {
        phoneInput.value = phone;
        callLink.href = "tel:+" + phone;
        setStatus("Номер получен из ссылки: " + phone);
      } else {
        callLink.href = "#";
        setStatus("Параметр phone не найден. Откройте страницу в формате: client.html?phone=79001234567", true);
      }

      copyButton.addEventListener("click", async function () {
        const value = phoneInput.value.trim();

        if (!value) {
          setStatus("Сначала укажите номер телефона.", true);
          return;
        }

        try {
          await navigator.clipboard.writeText(value);
          setStatus("Номер скопирован: " + value);
        } catch (error) {
          setStatus("Не удалось скопировать номер. Скопируйте его вручную.", true);
        }
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const value = normalizePhone(phoneInput.value);

        if (!value) {
          setStatus("Номер телефона пустой.", true);
          return;
        }

        phoneInput.value = value;
        callLink.href = "tel:+" + value;

        // Здесь потом можно добавить реальный поиск в CRM/API
        setStatus("Готово. Можно выполнять поиск клиента по номеру: " + value);
      });
    });
  </script>
</body>
</html>
