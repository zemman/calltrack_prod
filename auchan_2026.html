        @font-face {

            font-style: normal;

        }

        @font-face {
            font-family: "Raleway";
            font-style: normal;
            font-weight: 500;
            src: url("https://www.auchan.ru/storage/infopage_z1OsJG9a/Raleway-Medium.woff2") format("woff2"), url("https://www.auchan.ru/storage/infopage_z1OsJG9a/Raleway-Medium.ttf") format("ttf");
        }

        @font-face {
            font-family: "Raleway";
            font-style: normal;
            font-weight: 600;
            src: url("https://www.auchan.ru/storage/infopage_z1OsJG9a/Raleway-SemiBold.woff2") format("woff2"), url("https://www.auchan.ru/storage/infopage_z1OsJG9a/Raleway-SemiBold.ttf") format("ttf");
        }

        body {
            padding: 0;
            margin: 0;
            background-color: #f5f5f5;
        }

        .land * {
            text-size-adjust: none;
            -webkit-text-size-adjust: none;
            -moz-text-size-adjust: none;
            -ms-text-size-adjust: none;
        }

        .land p strong,
        .land p a,
        .land a {
            font-size: inherit;
            color: inherit;
            line-height: inherit;
        }
        .land a {
            font-weight: inherit;
            text-decoration: underline;
        }

        .land ul li,
        .land ol li {
            margin: 0;
        }

        .land {
            width: 100%;
            margin: 0 auto;
            padding: 0px;
            box-sizing: border-box;
            position: relative;
            display: block;
            overflow: hidden;
            z-index: 1;
            font-weight: 500;
            font-size: 20px;
            background-color: rgba(255, 255, 255, 1);
            color: rgb(31, 31, 31);
            font-family: "Raleway", Arial, Helvetica, sans-serif;

            --var-green: rgba(208, 235, 223, 1);
            --var-gray: rgba(240, 242, 245, 1);
            --var-darkgreen: rgba(0, 152, 95, 1);
            --var-smallText: 12px;
            --var-middleText: 14px;
            --var-headerSmall: 18px;
            --var-headerBig: 20px;
        }

        .land h2 {
            color: inherit;
            line-height: 1.15;
            margin: 0 0 24px;
        }
        .land p {
            color: inherit;
            line-height: 1.2;
        }
        .land strong {
            font-weight: bolder;
            font-size: inherit;
        }
        .land .section {
            padding: 24px 16px;
            width: 98%;
            max-width: 360px;
            margin: 0 auto 46px;
            box-sizing: border-box;
            border-radius: 16px;
        }
        .land .title {
            font-size: var(--var-headerSmall);
            font-weight: 900;
            margin: 0 0 24px;
            position: relative;
        }
        .land .title-big {
            font-size: var(--var-headerBig);
            margin: 0 0 16px;
        }
        .land .section-1 {
            margin-top: 40px;
        }
        .section-1 ul {
            margin: 0 0 24px;
            padding: 0;
        }
        .section-1 ul li {
            font-size: var(--var-middleText);
            list-style: none;
            line-height: 18px;
            padding-left: 32px;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: left top / 24px url(https://www.auchan.ru/storage/infopage_5s4rNIef/chevronSucc.svg) no-repeat;
            margin-bottom: 12px;
        }
        .section .title::before {
            width: 24px;
            content: '';
            position: absolute;
            height: 20px;
            background: left top / 24px url(https://www.auchan.ru/storage/infopage_5s4rNIef/bird-red.svg) no-repeat;
            left: 38px;
            top: -10px;
        }

        /*-------------------------------------ПОИСК-------------------------------------*/

        .search-container {
            background-color: var(--var-gray);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 15px 140px 15px 20px;
            font-family: "Raleway", Arial, Helvetica, sans-serif;
            font-size: var(--var-middleText);
            border: 2px solid rgba(221, 224, 230, 1);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
            background-color: #ffffff;
        }

        .search-input:focus {
            border-color: var(--var-darkgreen);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(100, 100, 100, 0.7);
            font-size: 18px;
            pointer-events: none;
        }

        .results-info {
            font-size: var(--var-smallText);
            color: rgba(100, 100, 100, 1);
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /*-------------------------------------КНОПКА ОЧИСТИТЬ-------------------------------------*/

        #clearSearchBtn {
            position: absolute;
            right: 45px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 12px;
            background-color: rgba(200, 200, 200, 0.5);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: rgba(80, 80, 80, 1);
            font-family: "Raleway", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }

        #clearSearchBtn.show {
            display: flex;
        }

        #clearSearchBtn:hover {
            background-color: #00985F;
            color: #ffffff;
        }

        #clearSearchBtn i {
            font-size: 10px;
        }

        /*-------------------------------------КАРТОЧКИ МАГАЗИНОВ-------------------------------------*/

        .store-cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .store-card {
            background-color: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(221, 224, 230, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .store-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .store-name {
            font-size: var(--var-headerSmall);
            font-weight: 700;
            color: rgb(31, 31, 31);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .info-icon {
            width: 24px;
            height: 24px;
            min-width: 24px;
            margin-right: 12px;
            color: var(--var-darkgreen);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .info-icon i {
            font-size: 18px;
        }

        .info-content {
            flex: 1;
            font-size: var(--var-middleText);
            line-height: 1.4;
        }

        .schedule-block {
            margin-bottom: 20px;
        }

        .schedule-title {
            font-size: var(--var-middleText);
            color: rgba(80, 80, 80, 1);
            margin-bottom: 10px;
        }

        .schedule-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .schedule-time {
            font-weight: 700;
            font-size: var(--var-headerSmall);
            color: var(--var-darkgreen);
            margin-right: 10px;
        }

        .schedule-date {
            font-size: var(--var-middleText);
            color: rgba(80, 80, 80, 1);
            font-weight: bold;
        }

        .normal-schedule {
            background-color: rgba(200, 200, 200, 0.3);
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .normal-schedule-label {
            font-size: var(--var-middleText);
            color: rgba(80, 80, 80, 1);
            margin-right: 10px;
        }

        .normal-schedule-time {
            font-weight: 700;
            font-size: var(--var-headerSmall);
            color: rgb(31, 31, 31);
        }

        .address-block {
            margin-top: 0;
        }

        .address-title {
            font-size: var(--var-middleText);
            color: rgba(80, 80, 80, 1);
            margin-bottom: 5px;
        }

        .address-value {
            font-size: var(--var-middleText);
            color: rgb(31, 31, 31);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--var-gray);
            border-radius: 12px;
            color: rgba(100, 100, 100, 1);
        }

        .no-results-icon {
            font-size: 48px;
            color: rgba(200, 200, 200, 1);
            margin-bottom: 20px;
        }

        .no-results-text {
            font-size: var(--var-middleText);
        }

            padding: 20px;
            background-color: var(--var-gray);
            border-radius: 12px;
            text-align: center;
            font-size: var(--var-middleText);
        }

        /*-------------------------------------КНОПКА НАВЕРХ-------------------------------------*/

        #scrollTopBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 22px;
            background-color: #00985F;
            color: #ffffff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            font-family: "Raleway", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
        }

        #scrollTopBtn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #scrollTopBtn:hover {
            background-color: #007a4d;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }

        #scrollTopBtn i {
            font-size: 14px;
            color: #ffffff;
        }

        #scrollTopBtn .btn-text {
            color: #ffffff;
        }

        /*-------------------------------------МЕДИА-ЗАПРОСЫ-------------------------------------*/

        @media (min-width: 768px) {
            .land .section {

            }

            .search-input {
                padding-right: 160px;
            }

            #clearSearchBtn {
                font-size: 12px;
                padding: 8px 14px;
                right: 50px;
            }
        }

        @media (min-width: 1200px) {
            .land {
                --var-smallText: 16px;
                --var-middleText: 20px;
                --var-headerSmall: 24px;
                --var-headerBig: 32px;
            }

            .land .section {
                max-width: 1096px;
                margin-bottom: 80px;
                padding: 0;
            }

            .land .section .container {
                padding: 40px;
                width: 100%;
                box-sizing: border-box;
            }

            .land .title {
                line-height: 1;
            }

            .section .title::before {
                width: 32px;
                height: 27px;
                left: 87px;
                top: -11px;
                background-size: contain;
            }

            .land .title {
                margin-bottom: 40px;
            }

            .land .title-big {
                margin-bottom: 24px;
            }

            .section .title-big::before {
                top: -8px;
            }

            .search-container {
                padding: 24px;
            }

            .search-input {
                padding-right: 180px;
            }

            #clearSearchBtn {
                font-size: 14px;
                padding: 10px 16px;
                right: 55px;
            }

            #clearSearchBtn i {
                font-size: 12px;
            }

            .info-icon {
                width: 28px;
                height: 28px;
                min-width: 28px;
            }

            .info-icon i {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            /* Кнопка Наверх на мобильных */
            #scrollTopBtn {
                width: 56px;
                height: 56px;
                padding: 0;
                border-radius: 50%;
                background-color: #00985F;
            }

            #scrollTopBtn .btn-text {
                display: none;
            }

            #scrollTopBtn i {
                font-size: 18px;
                color: #ffffff;
            }

            /* Кнопка Очистить на мобильных */
            #clearSearchBtn .btn-clear-text {
                display: none;
            }

            .search-input {
                padding-right: 90px;
            }

            #clearSearchBtn {
                padding: 8px 10px;
                right: 40px;
            }
        }

        /*-------------------------------------СНЕЖИНКИ-------------------------------------*/

        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 1000;
            color: #b0e0e6;
            font-size: 1em;
            font-family: Arial;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            user-select: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

    </style>
</head>

        // Функция для создания HTML карточки магазина
        function createStoreCard(store) {
            let scheduleHtml = '';
            if (store.schedule) {
                const scheduleParts = store.schedule.split('  ').filter(part => part.trim() !== '');
                scheduleParts.forEach(part => {
                    const match = part.match(/^(.*?):\s*(.+)$/);
                    if (match) {
                        const datePart = match[1].trim();
                        const timePart = match[2].trim();

                        if (timePart === 'не работает') {
                            scheduleHtml += `
                                <div class="schedule-item">
                                    <div class="schedule-time">${timePart}</div>
                                    <div class="schedule-date">${datePart}</div>
                                </div>
                            `;
                        } else {
                            const timeMatch = timePart.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
                            if (timeMatch) {
                                const startTime = timeMatch[1];
                                const endTime = timeMatch[2];
                                scheduleHtml += `
                                    <div class="schedule-item">
                                        <div class="schedule-time">${startTime} - ${endTime}</div>
                                        <div class="schedule-date">${datePart}</div>
                                    </div>
                                `;
                            } else {
                                scheduleHtml += `
                                    <div class="schedule-item">
                                        <div class="schedule-time">${timePart}</div>
                                        <div class="schedule-date">${datePart}</div>
                                    </div>
                                `;
                            }
                        }
                    }
                });
            }

            let normalSchedule = '';
            if (store.schedule_1) {
                const match = store.schedule_1.match(/^(.*?):\s*(.+)$/);
                if (match) {
                    const label = match[1].trim();
                    const timeRange = match[2].trim();
                    normalSchedule = `
                        <div class="normal-schedule">
                            <span class="normal-schedule-label">${label}</span>
                            <span class="normal-schedule-time">${timeRange}</span>
                        </div>
                    `;
                }
            }

            return `
                <div class="store-card" data-code="${store.code}" data-name="${store.name.toLowerCase()}" data-city="${store.city.toLowerCase()}" data-address="${store.address.toLowerCase()}">
                    <div class="store-name">${store.name}</div>
                    
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="info-content">
                            <div class="schedule-block">
                                <div class="schedule-title">Временный режим работы</div>
                                ${scheduleHtml}
                            </div>
                            
                            <div class="schedule-block">
                                <div class="schedule-title">Далее в обычном режиме</div>
                                ${normalSchedule}
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div class="info-content">
                            <div class="address-block">
                                <div class="address-title">Адрес</div>
                                <div class="address-value">г. ${store.city}, ${store.address}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Функция для отображения магазинов
        function renderStores(searchTerm = "") {
            const container = document.getElementById('storesContainer');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.getElementById('resultsCount');

            let filteredStores = stores;

            if (searchTerm.trim() !== "") {
                const searchLower = searchTerm.toLowerCase();
                filteredStores = stores.filter(store =>
                    store.name.toLowerCase().includes(searchLower) ||
                    store.city.toLowerCase().includes(searchLower) ||
                    store.address.toLowerCase().includes(searchLower)
                );
            }

            container.innerHTML = "";

            if (filteredStores.length === 0) {
                noResults.style.display = "block";
                resultsCount.textContent = "Магазины не найдены";
                return;
            } else {
                noResults.style.display = "none";
            }

            filteredStores.forEach(store => {
                container.innerHTML += createStoreCard(store);
            });

            resultsCount.textContent = `Найдено магазинов: ${filteredStores.length}`;
        }

        // Функция для обновления видимости кнопки очистки
        function updateClearButtonVisibility() {
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            
            if (searchInput.value.trim() !== '') {
                clearSearchBtn.classList.add('show');
            } else {
                clearSearchBtn.classList.remove('show');
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            renderStores();

            let searchTimeout;
            const searchInput = document.getElementById('searchInput');
            const searchHint = document.getElementById('searchHint');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            // Обработчик для кнопки очистки
            clearSearchBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchInput.focus();
                updateClearButtonVisibility();
                renderStores();
                searchHint.textContent = "";
            });

            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                updateClearButtonVisibility();

                if (this.value.trim() === "") {
                    searchHint.textContent = "";
                } else {
                    searchHint.textContent = "Поиск по названию, городу или адресу";
                }

                searchTimeout = setTimeout(() => {
                    renderStores(this.value);
                }, 300);
            });

            searchInput.focus();
            updateClearButtonVisibility();

            createSnowflakes();
            initScrollToTopButton();
        });

        // Функция для создания снежинок
        function createSnowflakes() {
            let snowflakes = [];

            function createSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.innerHTML = '❄';
                snowflake.classList.add('snowflake');

                const size = Math.random() * 15 + 10;
                const startX = Math.random() * window.innerWidth;
                const duration = Math.random() * 5 + 5;
                const delay = Math.random() * 5;

                snowflake.style.left = `${startX}px`;
                snowflake.style.fontSize = `${size}px`;
                snowflake.style.animationDuration = `${duration}s`;
                snowflake.style.animationDelay = `${delay}s`;

                document.body.appendChild(snowflake);
                snowflakes.push(snowflake);

                setTimeout(() => {
                    if (snowflake.parentNode) {
                        snowflake.remove();
                        snowflakes = snowflakes.filter(s => s !== snowflake);
                    }
                }, (duration + delay) * 1000);
            }

            setInterval(createSnowflake, 400);

            window.addEventListener('resize', () => {
                snowflakes.forEach(snowflake => {
                    if (snowflake.parentNode) {
                        snowflake.remove();
                    }
                });
                snowflakes = [];
            });
        }

        // Функция для кнопки "Наверх"
        function initScrollToTopButton() {
            const scrollTopBtn = document.getElementById('scrollTopBtn');

            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    scrollTopBtn.classList.add('show');
                } else {
                    scrollTopBtn.classList.remove('show');
                }
            });

            scrollTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }

    </script>
